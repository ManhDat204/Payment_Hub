spring.application.name=payment_hub_be
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/freepdb1
spring.datasource.username=PAYMENT_HUB
spring.datasource.password=${DB_PASSWORD:payment123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JWT configuration
jwt.secret=mySecretKeyForJWT1234567890123456789012345678901234567890
jwt.expiration=86400000

# Enable Spring Security debug logging
logging.level.org.springframework.security=DEBUG

# Enable SQL initialization (để chạy data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Show full error messages
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true