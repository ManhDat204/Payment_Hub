<div class="paymenthub-shell">
  <!-- Icon rail xanh đậm -->
  <aside class="icon-rail">
    <div class="icon-rail-top">
      <button class="rail-item" title="Tổng quan">
        <span class="rail-icon">⌂</span>
        <span class="rail-label">Tổng quan</span>
      </button>
      <button class="rail-item" title="Tham số">
        <span class="rail-icon">☰</span>
        <span class="rail-label">Tham số</span>
      </button>
      <button class="rail-item active" title="Tham số">
        <span class="rail-icon">☰</span>
        <span class="rail-label">Realtime</span>
      </button>
      <button class="rail-item" title="Non-Realtime">
        <span class="rail-icon">☰</span>
        <span class="rail-label">Non-Realtime</span>
      </button>
      <button class="rail-item" title="IMAP">
        <span class="rail-icon">☰</span>
        <span class="rail-label">IMAP</span>
      </button>
      <button class="rail-item" title="SWIFT">
        <span class="rail-icon">☰</span>
        <span class="rail-label">SWIFT</span>
      </button>
      <button class="rail-item" title="Kiểu hồi">
        <span class="rail-icon">↺</span>
        <span class="rail-label">Kiểu hồi</span>
      </button>
      <button class="rail-item" title="Tra soát">
        <span class="rail-icon">🔍</span>
        <span class="rail-label">Tra soát</span>
      </button>
      <button class="rail-item" title="Tham số">
        <span class="rail-icon">☰</span>
        <span class="rail-label">Tham số</span>
      </button>
      <button class="rail-item" title="Lải phí">
        <span class="rail-icon">$</span>
        <span class="rail-label">Lải phí</span>
      </button>
    </div>

    <div class="icon-rail-bottom">
      <button class="rail-item" title="Đăng xuất" (click)="onLogout()">
        <span class="rail-icon">⏻</span>
        <span class="rail-label">Đăng xuất</span>
      </button>
    </div>
  </aside>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-pay">PAYMENT</span>
        <span class="brand-hub">HUB</span>
      </div>
    </div>

    <nav class="nav-menu" aria-label="Sidebar navigation">
      <div class="nav-section-title">Cấu phần xử lý</div>
      <button class="nav-item active">
        <span>Tham số danh mục theo nhóm</span>
      </button>
      <button class="nav-item">
        <span>Kênh thanh toán</span>
      </button>
      <button class="nav-item">
        <span>Mã loại điện trả soát</span>
      </button>
      <button class="nav-item">
        <span>Tiêu chí phản hàn kênh</span>
      </button>
      <button class="nav-item">
        <span>Tạm dừng phán kênh</span>
      </button>
      <button class="nav-item">
        <span>Cấu hình dừng tuyến kênh...</span>
      </button>
      <button class="nav-item">
        <span>Kênh phân phối ứng dụng</span>
      </button>
      <button class="nav-item">
        <span>Tiêu chí chấm điểm kho...</span>
      </button>
    </nav>
  </aside>

  <main class="main-panel">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notifications">🔔</button>
        <div class="language-select">VIE ▾</div>
        <div class="user-box">
          <div class="avatar">H</div>
          <div class="user-meta">
            <div class="user-name">Hoàng Văn Thuận</div>
            <div class="user-role">Chuyên viên</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content-shell">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-toast></app-toast>
