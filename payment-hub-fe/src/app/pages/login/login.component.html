<div class="login-page-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Đăng nhập hệ thống</h2>
      <p>Vui lòng nhập thông tin đăng nhập</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Username -->
      <div class="form-field">
        <label for="username">Tên đăng nhập <span class="required">*</span></label>
        <input 
          id="username"
          type="text" 
          formControlName="username"
          placeholder="Nhập tên đăng nhập"
          class="input-field"
        />
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="field-error">
          Tên đăng nhập là bắt buộc
        </div>
      </div>

      <!-- Password -->
      <div class="form-field">
        <label for="password">Mật khẩu <span class="required">*</span></label>
        <input 
          id="password"
          type="password" 
          formControlName="password"
          placeholder="Nhập mật khẩu"
          class="input-field"
        />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="field-error">
          Mật khẩu là bắt buộc
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        ⚠️ {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
        class="login-button"
      >
        {{ loading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>
  </div>
</div>
