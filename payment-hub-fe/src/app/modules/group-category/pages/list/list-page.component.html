<div class="page-container">
  <div class="page-wrapper">

    <!-- Header Section -->
    <div class="header-section">
      <div class="page-breadcrumb">
        <span>Trang chủ</span>
        <span class="sep">›</span>
        <span>Tham số danh mục theo nhóm</span>
      </div>
      <div class="page-header-row">
        <h1 class="page-title">Tham số danh mục theo nhóm</h1>
        <button (click)="onAddNew()" class="btn-add">+ Thêm mới</button>
      </div>
    </div>

    <!-- Search Filter Section -->
    <div class="search-section">
      <app-group-category-search-filter
        (search)="onSearch($event)"
        (reset)="onReset()">
      </app-group-category-search-filter>
    </div>

    <!-- Data Grid Section -->
    <div class="grid-card">
      <!-- Grid Toolbar -->
      <div class="grid-toolbar">
        <div class="grid-title">
          Danh sách bản ghi
          <span class="grid-count">({{ data?.totalElements ?? 0 }})</span>
        </div>
        <div class="toolbar-right">
          <div *ngIf="selectedIds.size > 0" class="batch-actions">
            <span class="batch-label">Đã chọn {{ selectedIds.size }}</span>
            <button class="btn-secondary btn-sm" type="button" (click)="onBatchSubmit()">Gửi duyệt</button>
            <button class="btn-secondary btn-sm" type="button" (click)="onBatchApprove()">Phê duyệt</button>
            <button class="btn-secondary btn-sm" type="button" (click)="onBatchReject()">Từ chối</button>
            <button class="btn-secondary btn-sm" type="button" (click)="onBatchCancelApproval()">Hủy duyệt</button>
            <button class="btn-secondary btn-sm btn-delete-batch" type="button" (click)="onBatchDelete()">Xóa</button>
          </div>
          <button class="btn-secondary btn-sm" type="button" (click)="onViewAllHistory()">Lịch sử thao tác</button>
          <button class="btn-secondary btn-sm" type="button" (click)="onExport()" [disabled]="exporting">
            {{ exporting ? 'Đang xuất...' : 'Xuất Excel' }}
          </button>
        </div>
      </div>

      <!-- Data Grid -->
      <app-group-category-grid
        [data]="data"
        [loading]="loading"
        [selectedIds]="selectedIds"
        (rowDoubleClick)="onRowDoubleClick($event)"
        (selectionChange)="onSelectionChange($event)"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (edit)="onEdit($event)"
        (copy)="onCopy($event)"
        (history)="onHistory($event)">
      </app-group-category-grid>
    </div>

  </div>
</div>

<!-- Confirm Dialogs -->
<app-confirm-dialog
  *ngIf="showSubmitDialog"
  [config]="submitDialogConfig"
  (confirmed)="onSubmitConfirmed($event)">
</app-confirm-dialog>

<app-confirm-dialog
  *ngIf="showApproveDialog"
  [config]="approveDialogConfig"
  (confirmed)="onApproveConfirmed($event)">
</app-confirm-dialog>

<app-confirm-dialog
  *ngIf="showRejectDialog"
  [config]="rejectDialogConfig"
  (confirmed)="onRejectConfirmed($event)">
</app-confirm-dialog>

<app-confirm-dialog
  *ngIf="showCancelApprovalDialog"
  [config]="cancelApprovalDialogConfig"
  (confirmed)="onCancelApprovalConfirmed($event)">
</app-confirm-dialog>

<app-confirm-dialog
  *ngIf="showDeleteDialog"
  [config]="deleteDialogConfig"
  (confirmed)="onDeleteConfirmed($event)">
</app-confirm-dialog>

<app-group-category-history-dialog
  *ngIf="showHistoryDialog"
  (closed)="onCloseHistoryDialog()">
</app-group-category-history-dialog>

<!-- Detail Dialog -->
<app-group-category-detail-dialog
  *ngIf="showDetailDialog && selectedRecord"
  [record]="selectedRecord"
  [diff]="selectedDiff"
  (action)="onDetailAction($event)">
</app-group-category-detail-dialog>
