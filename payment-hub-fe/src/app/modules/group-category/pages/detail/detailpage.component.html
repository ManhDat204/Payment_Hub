<div class="page-container">
  <div class="page-header-back">
    <button class="btn-back" (click)="onBack()">
      <span class="arrow">&lt;</span>
      <span>Trở lại</span>
    </button>
    <h2 class="page-title">Xem chi tiết tham số danh mục theo nhóm</h2>
  </div>

  <div class="page-content">
    <app-group-category-detail-dialog
      *ngIf="record"
      [record]="record"
      [diff]="diff"
      (action)="onAction($event)">
    </app-group-category-detail-dialog>
  </div>
</div>
