<form [formGroup]="form" (ngSubmit)="onSearch()" style="background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow-md);">
  
  <!-- First Row: 4 columns -->
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 18px; margin-bottom: 14px;">
    
    <!-- Danh mục theo nhóm -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 12px; color: var(--text-secondary); font-weight: 600; margin: 0;">Danh mục theo nhóm</label>
      <input formControlName="paramType" 
             type="text" 
             placeholder="Nhập nội dung"
             style="width: 100%; height: 42px; border: 1px solid #dfe3e8; border-radius: 8px; background: #f8fafc; padding: 0 12px; font-size: 14px; color: var(--text-primary); transition: all 0.2s;"
             (focus)="$any($event.target).style.borderColor='#0b7b7d'; $any($event.target).style.boxShadow='0 0 0 3px rgba(11,123,125,0.12)'; $any($event.target).style.backgroundColor='#ffffff'"
             (blur)="$any($event.target).style.borderColor='#dfe3e8'; $any($event.target).style.boxShadow='none'; $any($event.target).style.backgroundColor='#f8fafc'" />
    </div>

    <!-- Giá trị thành phần -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 12px; color: var(--text-secondary); font-weight: 600; margin: 0;">Giá trị thành phần</label>
      <input formControlName="paramValue" 
             type="text" 
             placeholder="Nhập nội dung"
             style="width: 100%; height: 42px; border: 1px solid #dfe3e8; border-radius: 8px; background: #f8fafc; padding: 0 12px; font-size: 14px; color: var(--text-primary); transition: all 0.2s;"
             (focus)="$any($event.target).style.borderColor='#0b7b7d'; $any($event.target).style.boxShadow='0 0 0 3px rgba(11,123,125,0.12)'; $any($event.target).style.backgroundColor='#ffffff'"
             (blur)="$any($event.target).style.borderColor='#dfe3e8'; $any($event.target).style.boxShadow='none'; $any($event.target).style.backgroundColor='#f8fafc'" />
    </div>

    <!-- Tên thành phần -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 12px; color: var(--text-secondary); font-weight: 600; margin: 0;">Tên thành phần</label>
      <input formControlName="paramName" 
             type="text" 
             placeholder="Nhập nội dung"
             style="width: 100%; height: 42px; border: 1px solid #dfe3e8; border-radius: 8px; background: #f8fafc; padding: 0 12px; font-size: 14px; color: var(--text-primary); transition: all 0.2s;"
             (focus)="$any($event.target).style.borderColor='#0b7b7d'; $any($event.target).style.boxShadow='0 0 0 3px rgba(11,123,125,0.12)'; $any($event.target).style.backgroundColor='#ffffff'"
             (blur)="$any($event.target).style.borderColor='#dfe3e8'; $any($event.target).style.boxShadow='none'; $any($event.target).style.backgroundColor='#f8fafc'" />
    </div>

    <!-- Trạng thái tham số -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 12px; color: var(--text-secondary); font-weight: 600; margin: 0;">Trạng thái tham số</label>
      <div style="position: relative;">
        <button type="button"
                (click)="toggleStatusDropdown()"
                style="width: 100%; height: 42px; border: 1px solid #dfe3e8; border-radius: 8px; background: #f8fafc; padding: 0 12px; font-size: 14px; color: var(--text-primary); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ statusText }}</span>
          <span style="font-size: 12px; color: var(--text-secondary);">⌄</span>
        </button>
        <div *ngIf="statusDropdownOpen"
             style="position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: white; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px; cursor: pointer; color: var(--text-primary); font-size: 13px;">
            <input type="checkbox"
                   [checked]="selectedStatuses.length === 0"
                   (change)="clearStatuses()"
                   style="width: 16px; height: 16px;" />
            {{ ALL_OPTION_LABEL }}
          </label>
          <label *ngFor="let item of statusItems"
                 style="display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px; cursor: pointer; color: var(--text-primary); font-size: 13px;">
            <input type="checkbox"
                   [checked]="isStatusSelected(item.value)"
                   (change)="toggleStatus(item.value, $any($event.target).checked)"
                   style="width: 16px; height: 16px;" />
            {{ item.label }}
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Second Row: 4 columns layout (1 field + 3 cols space for buttons) -->
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 18px; align-items: end;">
    
    <!-- Trạng thái hoạt động -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 12px; color: var(--text-secondary); font-weight: 600; margin: 0;">Trạng thái hoạt động</label>
      <div style="position: relative;">
        <button type="button"
                (click)="toggleIsActiveDropdown()"
                style="width: 100%; height: 42px; border: 1px solid #dfe3e8; border-radius: 8px; background: #f8fafc; padding: 0 12px; font-size: 14px; color: var(--text-primary); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ isActiveText }}</span>
          <span style="font-size: 12px; color: var(--text-secondary);">⌄</span>
        </button>
        <div *ngIf="isActiveDropdownOpen"
             style="position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: white; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px; cursor: pointer; color: var(--text-primary); font-size: 13px;">
            <input type="checkbox"
                   [checked]="selectedActiveStatuses.length === 0"
                   (change)="clearActiveStatuses()"
                   style="width: 16px; height: 16px;" />
            {{ ALL_OPTION_LABEL }}
          </label>
          <label *ngFor="let item of isActiveItems"
                 style="display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px; cursor: pointer; color: var(--text-primary); font-size: 13px;">
            <input type="checkbox"
                   [checked]="isActiveSelected(item.value)"
                   (change)="toggleActiveStatus(item.value, $any($event.target).checked)"
                   style="width: 16px; height: 16px;" />
            {{ item.label }}
          </label>
        </div>
      </div>
    </div>

    <!-- Empty spacer columns -->
    <div></div>
    <div></div>

    <!-- Action Buttons -->
    <div style="display: flex; align-items: center; gap: 10px; justify-content: flex-end;">
      <button type="button" 
              (click)="onReset()"
              style="height: 40px; padding: 0 16px; background: white; border: 1px solid #dfe3e8; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--gray-700); cursor: pointer; transition: all 0.2s;"
              (mouseenter)="$any($event.target).style.backgroundColor='#f8fafc'"
              (mouseleave)="$any($event.target).style.backgroundColor='white'">
        Xóa bộ lọc
      </button>
      <button type="submit"
              style="height: 40px; padding: 0 16px; background: #0b7b7d; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; color: white; cursor: pointer; transition: all 0.2s;"
              (mouseenter)="$any($event.target).style.backgroundColor='#096668'"
              (mouseleave)="$any($event.target).style.backgroundColor='#0b7b7d'">
        Tìm kiếm
      </button>
    </div>
    
  </div>
</form>
