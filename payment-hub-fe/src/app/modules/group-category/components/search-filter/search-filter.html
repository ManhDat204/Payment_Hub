<form [formGroup]="form" (ngSubmit)="onSearch()" class="search-form">

  <!-- First Row: 4 columns -->
  <div class="filter-grid-4">

    <!-- Danh mục theo nhóm -->
    <div class="filter-field">
      <label class="filter-label">Danh mục theo nhóm</label>
      <input formControlName="paramType"
             type="text"
             placeholder="Nhập nội dung"
             class="filter-input" />
    </div>

    <!-- Giá trị thành phần -->
    <div class="filter-field">
      <label class="filter-label">Giá trị thành phần</label>
      <input formControlName="paramValue"
             type="text"
             placeholder="Nhập nội dung"
             class="filter-input" />
    </div>

    <!-- Tên thành phần -->
    <div class="filter-field">
      <label class="filter-label">Tên thành phần</label>
      <input formControlName="paramName"
             type="text"
             placeholder="Nhập nội dung"
             class="filter-input" />
    </div>

    <!-- Trạng thái tham số -->
    <div class="filter-field">
      <label class="filter-label">Trạng thái tham số</label>
      <div class="dropdown-wrapper">
        <button type="button"
                (click)="toggleStatusDropdown()"
                class="dropdown-trigger">
          <span class="dropdown-trigger-text">{{ statusText }}</span>
          <span class="dropdown-arrow">⌄</span>
        </button>
        <div *ngIf="statusDropdownOpen" class="dropdown-panel">
          <label class="dropdown-option">
            <input type="checkbox"
                   [checked]="selectedStatuses.length === 0"
                   (change)="clearStatuses()"
                   class="dropdown-checkbox" />
            {{ ALL_OPTION_LABEL }}
          </label>
          <label *ngFor="let item of statusItems" class="dropdown-option">
            <input type="checkbox"
                   [checked]="isStatusSelected(item.value)"
                   (change)="toggleStatus(item.value, $any($event.target).checked)"
                   class="dropdown-checkbox" />
            {{ item.label }}
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="filter-grid-4-bottom">

    <!-- Trạng thái hoạt động -->
    <div class="filter-field">
      <label class="filter-label">Trạng thái hoạt động</label>
      <div class="dropdown-wrapper">
        <button type="button"
                (click)="toggleIsActiveDropdown()"
                class="dropdown-trigger">
          <span class="dropdown-trigger-text">{{ isActiveText }}</span>
          <span class="dropdown-arrow">⌄</span>
        </button>
        <div *ngIf="isActiveDropdownOpen" class="dropdown-panel">
          <label class="dropdown-option">
            <input type="checkbox"
                   [checked]="selectedActiveStatuses.length === 0"
                   (change)="clearActiveStatuses()"
                   class="dropdown-checkbox" />
            {{ ALL_OPTION_LABEL }}
          </label>
          <label *ngFor="let item of isActiveItems" class="dropdown-option">
            <input type="checkbox"
                   [checked]="isActiveSelected(item.value)"
                   (change)="toggleActiveStatus(item.value, $any($event.target).checked)"
                   class="dropdown-checkbox" />
            {{ item.label }}
          </label>
        </div>
      </div>
    </div>

    <!-- Empty spacer columns -->
    <div></div>
    <div></div>

    <!-- Action Buttons -->
    <div class="filter-actions">
      <button type="button" (click)="onReset()" class="btn-reset">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H2L6.66667 7.56V12.3333L9.33333 14V7.56L14 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Xóa bộ lọc</span>
      </button>
      <button type="submit" class="btn-search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7.33333 12.6667C10.2789 12.6667 12.6667 10.2789 12.6667 7.33333C12.6667 4.38781 10.2789 2 7.33333 2C4.38781 2 2 4.38781 2 7.33333C2 10.2789 4.38781 12.6667 7.33333 12.6667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 14L11.1 11.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Tìm kiếm</span>
      </button>
    </div>

  </div>
</form>
