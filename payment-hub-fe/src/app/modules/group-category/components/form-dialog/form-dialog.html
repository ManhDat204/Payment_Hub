<!-- Dialog Overlay -->
<div class="dialog-overlay" (click)="onCancel()">
  <div class="dialog" (click)="$event.stopPropagation()">

    <!-- Dialog Header -->
    <div class="dialog-header">
      <div class="dialog-header-inner">
        <div class="dialog-header-left">
          <button (click)="onCancel()" class="btn-back">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M12.5 5L7.5 10L12.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h2 class="dialog-title">
            {{ title }} tham số danh mục theo nhóm
          </h2>
        </div>
        <button (click)="onCancel()" class="dialog-close">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Dialog Body -->
    <form [formGroup]="form">
      <div class="dialog-body">

        <!-- First Row: 4 columns -->
        <div class="form-grid-4">
          <!-- Danh mục theo nhóm -->
          <div>
            <label class="form-label required">Danh mục theo nhóm</label>
            <input formControlName="paramType"
                   type="text"
                   placeholder="Nhập nội dung"
                   [class.error]="form.get('paramType')?.invalid && form.get('paramType')?.touched"
                   class="form-input" />
            <div *ngIf="form.get('paramType')?.invalid && form.get('paramType')?.touched" class="field-error">
              Trường bắt buộc
            </div>
          </div>

          <!-- Giá trị thành phần -->
          <div>
            <label class="form-label required">Giá trị thành phần</label>
            <input formControlName="paramValue"
                   type="text"
                   placeholder="Nhập nội dung"
                   [class.error]="form.get('paramValue')?.invalid && form.get('paramValue')?.touched"
                   class="form-input" />
            <div *ngIf="form.get('paramValue')?.invalid && form.get('paramValue')?.touched" class="field-error">
              Trường bắt buộc
            </div>
          </div>

          <!-- Tên thành phần -->
          <div>
            <label class="form-label required">Tên thành phần</label>
            <input formControlName="paramName"
                   type="text"
                   placeholder="Nhập nội dung"
                   [class.error]="form.get('paramName')?.invalid && form.get('paramName')?.touched"
                   class="form-input" />
            <div *ngIf="form.get('paramName')?.invalid && form.get('paramName')?.touched" class="field-error">
              Trường bắt buộc
            </div>
          </div>

          <!-- Cấu phần xử lý -->
          <div>
            <label class="form-label required">Cấu phần xử lý</label>
            <select formControlName="componentCode"
                    [class.error]="form.get('componentCode')?.invalid && form.get('componentCode')?.touched"
                    class="form-select">
              <option value="">Chọn giá trị</option>
              <option *ngFor="let opt of componentOptions" [value]="opt.componentCode">
                {{ opt.componentCode }}{{ opt.componentName ? ' - ' + opt.componentName : '' }}
              </option>
            </select>
            <div *ngIf="form.get('componentCode')?.invalid && form.get('componentCode')?.touched" class="field-error">
              Trường bắt buộc
            </div>
          </div>
        </div>

        <!-- Second Row: 2 columns for dates -->
        <div class="form-grid-2">
          <!-- Ngày hiệu lực -->
          <div>
            <label class="form-label required">Ngày hiệu lực</label>
            <input formControlName="effectiveDate"
                   type="datetime-local"
                   [class.error]="form.get('effectiveDate')?.invalid && form.get('effectiveDate')?.touched"
                   class="form-input" />
            <div *ngIf="form.get('effectiveDate')?.hasError('required') && form.get('effectiveDate')?.touched" class="field-error">
              Trường bắt buộc
            </div>
            <div *ngIf="form.get('effectiveDate')?.hasError('pastDate') && form.get('effectiveDate')?.touched" class="field-error">
              Ngày hiệu lực không được là ngày quá khứ
            </div>
          </div>

          <!-- Ngày hết hiệu lực -->
          <div>
            <label class="form-label">Ngày hết hiệu lực</label>
            <input formControlName="endEffectiveDate"
                   type="datetime-local"
                   class="form-input" />
          </div>
        </div>

        <!-- Third Row: Full width for Mô tả -->
        <div>
          <label class="form-label">Mô tả</label>
          <textarea formControlName="description"
                    placeholder="Nhập nội dung"
                    rows="3"
                    class="form-textarea"></textarea>
        </div>

      </div>

      <!-- Dialog Footer -->
      <div class="dialog-footer">
        <button type="button" (click)="onCancel()" class="btn-cancel">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" (click)="save()" class="btn-save">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
            <path d="M12.6667 2H3.33333C2.59695 2 2 2.59695 2 3.33333V12.6667C2 13.403 2.59695 14 3.33333 14H12.6667C13.403 14 14 13.403 14 12.6667V3.33333C14 2.59695 13.403 2 12.6667 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11.3333 2V5.33333H4.66667V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Lưu
        </button>
        <button type="button" (click)="saveAndSubmit()" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
            <path d="M13.3333 4L6 11.3333L2.66667 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Lưu và gửi duyệt
        </button>
      </div>
    </form>

  </div>
</div>
